<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华为海外研发中心选址 · 判断矩阵互动课堂</title>
<style>
:root{
  --bg:#f3f5f7;
  --surface:#ffffff;
  --surface2:#f7f9fa;
  --text:#20262e;
  --muted:#66717d;
  --border:#dfe5ea;
  --primary:#0e8a78;
  --primary-ink:#ffffff;
  --accent:#f0a63c;
  --coral:#df5b4c;
  --good:#1f9d63;
  --warn:#d9820b;
  --bad:#d94444;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1120px;margin:0 auto;padding:18px 20px 64px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#0e8a78,#2bb89d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;flex:none}
.brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:0}
.brand .sub{font-size:12.5px;color:var(--muted);margin:1px 0 0}
.steps{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.step-chip{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit}
.step-chip .num{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border:1px solid var(--border)}
.step-chip.is-active{border-color:var(--primary);color:var(--primary);background:#f0fbf8}
.step-chip.is-active .num{background:var(--primary);color:#fff;border-color:var(--primary)}
.step-chip.is-done{color:var(--primary)}
.step-chip.is-done .num{background:#d8f2eb;color:var(--primary);border-color:#bfe6dc}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px 24px}
.panel-head h2,.subhead h2{font-size:17px;margin:0 0 5px;font-weight:600;letter-spacing:0}
.panel-head p,.subhead p{margin:0;color:var(--muted);font-size:13.5px}
.subhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:2px}
.progress{flex:1;min-width:180px;max-width:340px;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2bb89d);border-radius:6px;transition:width .3s}
.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap;font-family:inherit}
.btn:hover{border-color:#b9c3cc;background:var(--surface2)}
.btn svg{flex:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:#0b7767;border-color:#0b7767}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#2a1c06}
.btn-accent:hover{background:#e09a2e;border-color:#e09a2e}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface2);border-color:transparent;color:var(--text)}
.btn-sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.controls{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.spacer{flex:1}
.actor-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.actor-bar .flabel{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.seg-btn.is-on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg-btn.add{border-style:dashed}
.seg-btn:hover{border-color:#b9c3cc}
.field{display:block;margin:18px 0}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--text);background:var(--surface)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,138,120,.12)}
.crit-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 9px;gap:10px;flex-wrap:wrap}
.crit-list{display:flex;flex-direction:column;gap:8px}
.crit-row{display:flex;align-items:center;gap:8px}
.crit-idx{width:22px;height:22px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none}
.crit-row .input{flex:1}
.hint{font-size:13px;color:var(--muted)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:18px 0 8px}
.duel-card{border-radius:8px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-top:4px solid transparent}
.duel-a{border-top-color:var(--primary)}
.duel-b{border-top-color:var(--coral)}
.duel-card .role{font-size:12px;color:var(--muted)}
.duel-card .name{font-size:27px;font-weight:600;text-align:center;letter-spacing:0}
.vs{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:20px;letter-spacing:0}
.legend{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:8px 0 4px;font-size:11px;color:var(--muted);text-align:center}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:6px 0 16px}
.vote-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent;font-family:inherit}
.vote-cell.side-a{border-top-color:var(--primary)}
.vote-cell.side-b{border-top-color:var(--coral)}
.vote-cell.side-eq{border-top-color:var(--accent);background:#fffaf0}
.vc-name{font-size:12px;color:var(--muted);text-align:center}
.vc-val{font-size:12px;font-weight:600;color:var(--muted)}
.vc-count{font-size:24px;font-weight:600;line-height:1.05}
.vc-word{font-size:11px;color:var(--muted);text-align:center}
.vc-btns{display:flex;gap:4px;margin-top:3px}
.mini{width:26px;height:24px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0;font-family:inherit}
.mini:hover{background:#edf0f3;color:var(--text)}
.mini svg{width:13px;height:13px}
.vote-cell.selectable{appearance:none;cursor:pointer;text-align:center}
.vote-cell.selectable:hover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,138,120,.10)}
.vote-cell.selectable.is-selected{border-color:var(--primary);background:#f0fbf8;box-shadow:0 0 0 3px rgba(14,138,120,.16)}
.consensus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px}
.c-label{font-size:13px;color:var(--muted);flex:none}
.c-value{font-weight:600;font-size:15px}
.c-total{font-size:13px;color:var(--muted);margin-left:auto}
.matrix-wrap{overflow:auto;margin-top:16px}
table.matrix{border-collapse:collapse;width:100%;min-width:460px}
.matrix th,.matrix td{border:1px solid var(--border);padding:10px 8px;text-align:center;font-size:14px}
.matrix th{background:var(--surface2);font-weight:600}
.matrix th.corner{color:var(--muted);font-weight:500}
.matrix th.row-head{background:var(--surface2);font-weight:600;text-align:left}
.matrix td.diag{background:var(--surface2);color:var(--muted)}
.matrix td.cell-new{animation:pop 1.2s}
.matrix td.max{background:#eafaf4;font-weight:600}
.matrix td.ok-t{color:var(--good);font-weight:600}
.matrix td.bad-t{color:var(--bad);font-weight:600}
@keyframes pop{from{background:#c9efe7}to{background:transparent}}
.result-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}
.card{border:1px solid var(--border);border-radius:8px;padding:18px;background:var(--surface)}
.card h3{font-size:14px;margin:0 0 12px;font-weight:600;letter-spacing:0}
.bar-row{display:grid;grid-template-columns:74px 1fr 56px;gap:10px;align-items:center;margin:10px 0}
.bar-label{font-size:13px}
.bar-track{background:var(--surface2);height:18px;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2bb89d);border-radius:6px;transition:width .4s}
.bar-pct{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.metric span{color:var(--muted)}
.metric b{font-variant-numeric:tabular-nums}
.gauge-track{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--good),var(--warn) 50%,var(--bad));position:relative;margin:18px 0 22px}
.gauge-marker{position:absolute;top:-5px;width:4px;height:22px;background:var(--text);border-radius:2px;transform:translateX(-50%)}
.verdict{font-size:14px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:10px}
.verdict.ok{background:#e9f7ef;color:#177245}
.verdict.warn{background:#fdf2dd;color:#9a5d08}
.verdict.bad{background:#fdeaea;color:#b23131}
.cmp-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.cmp-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start;margin:12px 0}
.cmp-label{font-size:13px;padding-top:4px;font-weight:600}
.cmp-bars{display:flex;flex-direction:column;gap:5px}
.cmp-stu{display:grid;grid-template-columns:64px 1fr 46px;gap:8px;align-items:center}
.stu-name{font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-track{height:15px;background:var(--surface2);border-radius:6px;overflow:hidden}
.cmp-fill{height:100%;border-radius:6px;transition:width .3s}
.cmp-val{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sr-file{display:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#222c36;color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  .app{padding:14px 12px 48px}
  .panel{padding:18px 14px}
  .duel-card .name{font-size:21px}
  .duel-card{padding:18px 8px}
  .vs{font-size:16px}
  .legend{display:none}
  .vc-word,.vc-val{display:none}
  .vc-count{font-size:20px}
  .result-grid{grid-template-columns:1fr}
  .cmp-row{grid-template-columns:1fr}
  .cmp-label{padding-top:0}
  .controls{justify-content:flex-end}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">AHP</div>
      <div>
        <h1>华为海外研发中心选址</h1>
        <div class="sub">层次分析法 · 三地备选方案：德国 / 英国 / 马来西亚</div>
      </div>
    </div>
    <div class="steps" id="steps"></div>
    <button id="btnReset" class="btn btn-ghost">重新开始</button>
  </header>
  <main id="main"></main>
</div>
<script>
(function(){
  var main = document.getElementById('main');
  var stepsEl = document.getElementById('steps');

  var RI = [0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49,1.51,1.48,1.56,1.57,1.59];
  var STUDENT_COLORS = ['#0e8a78','#df5b4c','#f0a63c','#4f7cbf','#8b5fb0','#3f8f5a','#c26b2b','#a04f78'];
  var CONSENSUS_COLOR = '#303a44';
  var LS_KEY = 'ahp-classroom-huawei-v3';

  var state = {
    problem:'华为海外研发中心选址',
    alternatives:['德国','英国','马来西亚'],
    criteria:['人才与研发资源','成本与运营效率','产业与创新生态','政策与营商环境','市场与客户接近度'],
    students:[{name:'学生甲',judgments:{}},{name:'学生乙',judgments:{}},{name:'学生丙',judgments:{}}],
    step:1,
    pairs:[],
    cur:0,
    consensusJudgments:{},
    votes:{},
    mode:'consensus',
    viewActor:'consensus'
  };

  var SCALE = [
    {side:1,mag:9,word:'极端'},
    {side:1,mag:7,word:'强烈'},
    {side:1,mag:5,word:'明显'},
    {side:1,mag:3,word:'稍微'},
    {side:0,mag:1,word:'同等'},
    {side:-1,mag:3,word:'稍微'},
    {side:-1,mag:5,word:'明显'},
    {side:-1,mag:7,word:'强烈'},
    {side:-1,mag:9,word:'极端'}
  ];

  function ic(name){
    var p={
      plus:'<path d="M12 5v14M5 12h14"/>',
      minus:'<path d="M5 12h14"/>',
      check:'<path d="M20 6 9 17l-5-5"/>',
      zap:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>',
      left:'<path d="M19 12H5m7-7-7 7 7 7"/>',
      right:'<path d="M5 12h14m-7-7 7 7-7 7"/>',
      reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/>',
      trash:'<path d="M3 6h18M8 6V4h8v2m1 0-1 14H8L7 6"/>',
      plusc:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
      chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
      down:'<path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 21h14"/>',
      up:'<path d="M12 21V9m-5 5 5-5 5 5"/><path d="M5 3h14"/>'
    };
    return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[name]||'')+'</svg>';
  }

  function $id(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function sum(a){ return a.reduce(function(s,x){return s+x;},0); }
  function argmax(a){ var m=0; for(var i=1;i<a.length;i++){ if(a[i]>a[m]) m=i; } return m; }

  function showToast(msg){
    var t=$id('toast');
    if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h=setTimeout(function(){ t.classList.remove('show'); },2600);
  }

  function pairsFor(n){
    var ps=[];
    for(var i=0;i<n;i++){ for(var j=i+1;j<n;j++){ ps.push({i:i,j:j}); } }
    return ps;
  }

  function ensurePairs(){ if(state.pairs.length===0 && state.criteria.length>=2){ state.pairs=pairsFor(state.criteria.length); } }
  function curKey(){ var p=state.pairs[state.cur]; return p.i+'-'+p.j; }
  function votesFor(){ var k=curKey(); if(!state.votes[k]) state.votes[k]=[0,0,0,0,0,0,0,0,0]; return state.votes[k]; }

  function getStudent(name){ for(var i=0;i<state.students.length;i++){ if(state.students[i].name===name) return state.students[i]; } return null; }
  function actorJudgments(actor){ if(actor==='consensus') return state.consensusJudgments; var st=getStudent(actor); return st?st.judgments:{}; }
  function actorDone(actor){ return Object.keys(actorJudgments(actor)).length; }

  function posToSaaty(pos){
    if(pos===4) return {value:1,dir:0,mag:1};
    var s=SCALE[pos];
    if(s.side===1) return {value:s.mag,dir:1,mag:s.mag};
    return {value:1/s.mag,dir:-1,mag:s.mag};
  }

  function posForValue(v){
    for(var pos=0;pos<9;pos++){ if(posToSaaty(pos).value===v) return pos; }
    return -1;
  }

  function describe(pos,A,B){
    if(pos===4) return A+' 与 '+B+' 同等重要（1）';
    var s=SCALE[pos];
    if(s.side===1) return A+' 比 '+B+' '+s.word+'重要（'+s.mag+'）';
    return B+' 比 '+A+' '+s.word+'重要（'+s.mag+'）';
  }

  function medianPos(v){
    var expanded=[];
    v.forEach(function(c,p){ for(var k=0;k<c;k++) expanded.push(p); });
    if(expanded.length===0) return 4;
    expanded.sort(function(a,b){return a-b;});
    var mid=Math.floor(expanded.length/2);
    if(expanded.length%2===1) return expanded[mid];
    return Math.round((expanded[mid-1]+expanded[mid])/2);
  }

  function roundToSaaty(r){
    if(r>=1){
      var arr=[1,2,3,4,5,6,7,8,9], best=1, bd=1e9;
      arr.forEach(function(x){ var d=Math.abs(r-x); if(d<bd){bd=d;best=x;} });
      return best;
    }
    return 1/roundToSaaty(1/r);
  }

  function samplePos(center){
    var w=SCALE.map(function(_,pos){ return 1/(1+2.2*Math.abs(pos-center)); });
    var s=sum(w), r=Math.random()*s;
    for(var pos=0;pos<9;pos++){ r-=w[pos]; if(r<=0) return pos; }
    return center;
  }

  function genNearConsistent(n){
    var w=Array.from({length:n},function(){ return Math.exp(Math.random()*1.6); });
    var j={};
    for(var i=0;i<n;i++){ for(var jj=i+1;jj<n;jj++){ j[i+'-'+jj]=roundToSaaty(w[i]/w[jj]); } }
    return j;
  }

  function fmtValue(v){
    if(v>=1) return String(Math.round(v));
    var r=1/v;
    if(Math.abs(r-Math.round(r))<1e-9) return '1/'+Math.round(r);
    return String(Math.round(r*100)/100);
  }

  function buildMatrix(j,n){
    var A=[];
    for(var i=0;i<n;i++){ A.push([]); for(var k=0;k<n;k++) A[i].push(1); }
    for(var i=0;i<n;i++){ for(var jj=i+1;jj<n;jj++){ var v=j[i+'-'+jj]||1; A[i][jj]=v; A[jj][i]=1/v; } }
    return A;
  }

  function compute(j,n){
    var A=buildMatrix(j,n);
    var g=A.map(function(row){ return Math.pow(row.reduce(function(p,x){return p*x;},1),1/n); });
    var s=sum(g);
    var w=g.map(function(x){return x/s;});
    var Aw=A.map(function(row){ return row.reduce(function(acc,x,idx){return acc+x*w[idx];},0); });
    var lambda=Aw.reduce(function(acc,v,k){return acc+v/w[k];},0)/n;
    var CI=(lambda-n)/(n-1);
    var CR=CI/(RI[n]||1e-9);
    return {A:A,w:w,lambda:lambda,CI:CI,CR:CR,n:n};
  }

  function isComplete(j,n){
    for(var i=0;i<n;i++){ for(var jj=i+1;jj<n;jj++){ if(!((i+'-'+jj) in j)) return false; } }
    return true;
  }

  function completeActors(){
    var n=state.criteria.length, arr=[];
    if(isComplete(state.consensusJudgments,n)) arr.push('consensus');
    state.students.forEach(function(s){ if(isComplete(s.judgments,n)) arr.push(s.name); });
    return arr;
  }

  function actorColor(a){
    if(a==='consensus') return CONSENSUS_COLOR;
    var idx=state.students.findIndex(function(s){return s.name===a;});
    return STUDENT_COLORS[((idx%STUDENT_COLORS.length)+STUDENT_COLORS.length)%STUDENT_COLORS.length];
  }

  function save(){
    try{
      var d={problem:state.problem,alternatives:state.alternatives,criteria:state.criteria,students:state.students,consensusJudgments:state.consensusJudgments,votes:state.votes,step:state.step,cur:state.cur,mode:state.mode,viewActor:state.viewActor};
      localStorage.setItem(LS_KEY,JSON.stringify(d));
    }catch(e){}
  }

  function applyImport(d){
    if(!d || !Array.isArray(d.criteria)) return false;
    state.problem=String(d.problem||state.problem);
    state.alternatives=(Array.isArray(d.alternatives)?d.alternatives:['德国','英国','马来西亚']).map(function(x){return String(x);}).filter(Boolean);
    state.criteria=d.criteria.map(function(x){return String(x);}).filter(Boolean);
    state.students=(d.students||[]).map(function(s){ return {name:String(s.name),judgments:(s.judgments&&typeof s.judgments==='object')?s.judgments:{}}; });
    state.consensusJudgments=(d.consensusJudgments&&typeof d.consensusJudgments==='object')?d.consensusJudgments:{};
    state.pairs=pairsFor(state.criteria.length);
    state.cur=0; state.step=1; state.mode='consensus'; state.viewActor='consensus';
    return true;
  }

  function load(){
    try{
      var raw=localStorage.getItem(LS_KEY);
      if(!raw) return false;
      var d=JSON.parse(raw);
      if(!applyImport(d)) return false;
      state.step=Math.min(5,Math.max(1,+d.step||1));
      state.cur=+d.cur||0;
      state.votes=(d.votes&&typeof d.votes==='object')?d.votes:{};
      state.mode=d.mode||'consensus';
      state.viewActor=d.viewActor||'consensus';
      return true;
    }catch(e){ return false; }
  }

  function download(name,text){
    var a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(text);
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function exportData(){
    var data={problem:state.problem,alternatives:state.alternatives,criteria:state.criteria,consensusJudgments:state.consensusJudgments,students:state.students};
    download('ahp-judgments.json', JSON.stringify(data,null,2));
  }

  function importJSON(file){
    if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!applyImport(d)){ showToast('导入失败：缺少指标'); return; }
        save(); render(); showToast('已导入 '+state.students.length+' 名学生');
      }catch(e){ showToast('导入失败：文件格式不正确'); }
    };
    r.readAsText(file);
  }

  function render(){
    renderSteps();
    if(state.step===1) renderSetup();
    else if(state.step===2) renderCompare();
    else if(state.step===3) renderMatrix();
    else if(state.step===4) renderResults();
    else renderCompareStudents();
  }

  function renderSteps(){
    var defs=['设定','两两比较','判断矩阵','权重与一致性','学生对比'];
    stepsEl.innerHTML=defs.map(function(d,idx){
      var n=idx+1, cls='step-chip';
      if(state.step===n) cls+=' is-active';
      else if(state.step>n) cls+=' is-done';
      return '<button class="'+cls+'" data-step="'+n+'"><span class="num">'+n+'</span><span class="lbl">'+d+'</span></button>';
    }).join('');
    stepsEl.querySelectorAll('.step-chip').forEach(function(b){
      b.addEventListener('click',function(){ go(+b.dataset.step); });
    });
  }

  function go(n){
    if(n<1||n>5) return;
    if(n>1 && state.criteria.length<2){ showToast('请先在第一步填写至少两个评价指标'); return; }
    state.step=n;
    ensurePairs();
    render();
  }
  function renderSetup(){
    var n=state.criteria.length;
    var pairCount=n*(n-1)/2;
    main.innerHTML=''
      +'<section class="panel">'
      +'<div class="panel-head"><h2>第一步 · 设定决策问题、评价指标与学生名单</h2><p>先明确决策问题，再确定指标，并添加要录入个人判断的学生。</p></div>'
      +'<label class="field"><span class="flabel">决策问题</span><input id="problemInput" class="input" value="'+esc(state.problem)+'"></label>'
      +'<div class="crit-head"><span class="flabel">备选方案</span><button id="addAlternative" class="btn btn-ghost btn-sm">'+ic('plusc')+' 添加方案</button></div>'
      +'<div id="alternativeList" class="crit-list"></div>'
      +'<div class="crit-head"><span class="flabel">评价指标</span><button id="addCriterion" class="btn btn-ghost btn-sm">'+ic('plusc')+' 添加指标</button></div>'
      +'<div id="criteriaList" class="crit-list"></div>'
      +'<div class="crit-head"><span class="flabel">学生名单（每人一份主观判断矩阵）</span><button id="addStudent" class="btn btn-ghost btn-sm">'+ic('plusc')+' 添加学生</button></div>'
      +'<div id="studentList" class="crit-list"></div>'
      +'<div class="panel-foot"><span class="hint">共 '+pairCount+' 组两两比较</span><button id="startBtn" class="btn btn-primary">'+ic('right')+' 开始两两比较</button></div>'

    $id('addStudent').addEventListener('click',function(){ state.students.push({name:'学生'+(state.students.length+1),judgments:{}}); renderStudentList(); save(); });
    $id('startBtn').addEventListener('click',startComparisons);

  function renderAlternativeList(){
    var list=$id('alternativeList');
    if(!list) return;
    list.innerHTML=state.alternatives.map(function(a,idx){
      return '<div class="crit-row">'
        +'<span class="crit-idx">'+(idx+1)+'</span>'

        +'</div>';

  function renderStudentList(){
    var list=$id('studentList');
    if(!list) return;
    list.innerHTML=state.students.map(function(s,idx){
      return '<div class="crit-row">'
        +'<span class="crit-idx">'+(idx+1)+'</span>'
        +'<input class="input" data-sidx="'+idx+'" value="'+esc(s.name)+'" placeholder="学生姓名">'

        state.students[idx].name=e.target.value;

      });

        var idx=+b.dataset.sidx;
        var old=state.students[idx].name;

        if(state.mode===old) state.mode='consensus';
        if(state.viewActor===old) state.viewActor='consensus';
        renderStudentList();
        save();
      });

  function startComparisons(){
    var cleaned=state.criteria.map(function(s){return s.trim();}).filter(Boolean);
    if(cleaned.length<2){ showToast('请至少填写两个评价指标'); return; }
    var cleanedAlts=state.alternatives.map(function(s){return s.trim();}).filter(Boolean);
    if(cleanedAlts.length<2){ showToast('请至少填写两个备选方案'); return; }
    state.criteria=cleaned;
    state.alternatives=cleanedAlts;
    state.pairs=pairsFor(cleaned.length);
    state.cur=0;
    state.consensusJudgments={};
    state.votes={};
    state.step=2;
    save();
    render();
  }

  function renderCompare(){
    ensurePairs();
    if(state.pairs.length===0){ main.innerHTML='<section class="panel"><div class="panel-head"><h2>请先完成第一步设置</h2></div><div class="controls"><button id="toSetup" class="btn btn-primary">'+ic('left')+' 返回设定</button></div></section>'; $id('toSetup').addEventListener('click',function(){ state.step=1; render(); }); return; }

    var p=state.pairs[state.cur];
    var A=state.criteria[p.i], B=state.criteria[p.j];
    var totalPairs=state.pairs.length;
    var isConsensus=(state.mode==='consensus');
    var done=actorDone(state.mode);
    var pct=Math.round(done/totalPairs*100);

    var head='<div class="subhead"><div><h2>第二步 · 两两比较</h2><p class="hint">第 '+(state.cur+1)+' / '+totalPairs+' 组 · 已录入 '+done+' 组</p></div>'
      +'<div class="progress"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';

    var segBtns='<button class="seg-btn'+(isConsensus?' is-on':'')+'" data-actor="consensus">班级投票</button>'
      + state.students.map(function(s){ return '<button class="seg-btn'+(state.mode===s.name?' is-on':'')+'" data-actor="'+esc(s.name)+'">'+esc(s.name)+'</button>'; }).join('')
      +'<button class="seg-btn add" id="addStudent2">＋ 学生</button>';

    var duel='<div class="duel">'
      +'<div class="duel-card duel-a"><span class="role">指标 A</span><span class="name">'+esc(A)+'</span></div>'
      +'<div class="vs">VS</div>'
      +'<div class="duel-card duel-b"><span class="role">指标 B</span><span class="name">'+esc(B)+'</span></div>'
      +'</div>';

    var legend='<div class="legend"><span>9 极端</span><span>7 强烈</span><span>5 明显</span><span>3 稍微</span><span>1 同等</span><span>3 稍微</span><span>5 明显</span><span>7 强烈</span><span>9 极端</span></div>';

    var body;
    if(isConsensus){
      var v=votesFor();
      var total=sum(v);
      var scaleHtml=SCALE.map(function(s,pos){
        var cls='vote-cell';
        if(s.side===1) cls+=' side-a'; else if(s.side===-1) cls+=' side-b'; else cls+=' side-eq';
        var name=(s.side===1?A:(s.side===-1?B:'同等'));
        var valLabel=(s.side===0?'1':String(s.mag));
        return '<div class="'+cls+'">'
          +'<span class="vc-name">'+esc(name)+'</span>'
          +'<span class="vc-val">'+valLabel+'</span>'
          +'<span class="vc-count" data-pos="'+pos+'">'+v[pos]+'</span>'
          +'<span class="vc-word">'+s.word+'重要</span>'
          +'<div class="vc-btns">'
          +'<button class="mini minus" data-pos="'+pos+'" aria-label="减少一票">'+ic('minus')+'</button>'
          +'<button class="mini plus" data-pos="'+pos+'" aria-label="增加一票">'+ic('plus')+'</button>'
          +'</div></div>';
      }).join('');

      body=duel+legend+'<div class="scale">'+scaleHtml+'</div>'
        +'<div class="consensus"><span class="c-label">班级共识</span><span class="c-value" id="consensusText">'+(total?describe(medianPos(v),A,B):'等待投票…')+'</span><span class="c-total" id="cTotal">共 '+total+' 票</span></div>'
        +'<div class="controls">'
        +'<button id="simBtn" class="btn btn-accent">'+ic('zap')+' 模拟全班投票</button>'
        +'<span class="spacer"></span>'
        +'<button id="prevBtn" class="btn btn-ghost">'+ic('left')+' 上一步</button>'
        +'<button id="lockBtn" class="btn btn-primary">'+ic('check')+' 记录共识并进入下一组</button>'
        +'</div>'
        +'<div class="panel-foot"><button id="autoBtn" class="btn btn-ghost btn-sm">'+ic('chart')+' 用示例数据填充班级共识矩阵</button></div>';
    } else {
      var st=getStudent(state.mode);
      var curVal=st?st.judgments[curKey()]:undefined;
      var selPos=posForValue(curVal);
      var scaleHtml2=SCALE.map(function(s,pos){
        var cls='vote-cell selectable';
        if(s.side===1) cls+=' side-a'; else if(s.side===-1) cls+=' side-b'; else cls+=' side-eq';
        if(pos===selPos) cls+=' is-selected';
        var name=(s.side===1?A:(s.side===-1?B:'同等'));
        var valLabel=(s.side===0?'1':String(s.mag));
        return '<button type="button" class="'+cls+'" data-pos="'+pos+'">'
          +'<span class="vc-name">'+esc(name)+'</span>'
          +'<span class="vc-val">'+valLabel+'</span>'
          +'<span class="vc-word">'+s.word+'重要</span>'
          +'</button>';
      }).join('');

      body=duel+legend+'<div class="scale">'+scaleHtml2+'</div>'
        +'<div class="consensus"><span class="c-label">'+esc(state.mode)+' 的主观判断</span><span class="c-value">点击上方 9 个位置之一完成本组比较</span></div>'
        +'<div class="controls">'
        +'<button id="genCurBtn" class="btn btn-accent">'+ic('zap')+' 随机录入该学生全部判断</button>'
        +'<span class="spacer"></span>'
        +'<button id="prevBtn" class="btn btn-ghost">'+ic('left')+' 上一步</button>'
        +'</div>'
        +'<div class="panel-foot"><span class="hint">'+(done>0?'已录入 '+done+' 组，点击可继续修改':'该学生尚未开始录入')+'</span></div>';
    }

    main.innerHTML='<section class="panel">'+head
      +'<div class="actor-bar"><span class="flabel">当前录入</span><div class="seg" id="modeSeg">'+segBtns+'</div></div>'
      + body
      +'</section>';

    $id('modeSeg').querySelectorAll('.seg-btn[data-actor]').forEach(function(b){
      b.addEventListener('click',function(){ state.mode=b.dataset.actor; render(); });
    });
    var add2=$id('addStudent2');
    if(add2) add2.addEventListener('click',function(){ var st={name:'学生'+(state.students.length+1),judgments:{}}; state.students.push(st); state.mode=st.name; save(); render(); });

    var prevBtn=$id('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click',function(){ if(state.cur>0){ state.cur--; render(); } else { state.step=1; render(); } });

    if(isConsensus){
      main.querySelectorAll('.plus').forEach(function(b){ b.addEventListener('click',function(){ increment(+b.dataset.pos); }); });
      main.querySelectorAll('.minus').forEach(function(b){ b.addEventListener('click',function(){ decrement(+b.dataset.pos); }); });
      $id('simBtn').addEventListener('click',simulateVotes);
      $id('lockBtn').addEventListener('click',lockConsensus);
      $id('autoBtn').addEventListener('click',autoFillConsensus);
    } else {
      main.querySelectorAll('.vote-cell.selectable').forEach(function(b){
        b.addEventListener('click',function(){ pickForStudent(+b.dataset.pos); });
      });
      $id('genCurBtn').addEventListener('click',genCurrentStudent);
    }
  }

  function increment(pos){ votesFor()[pos]++; updateVoteUI(); }
  function decrement(pos){ var v=votesFor(); if(v[pos]>0) v[pos]--; updateVoteUI(); }

  function updateVoteUI(){
    var p=state.pairs[state.cur];
    var A=state.criteria[p.i], B=state.criteria[p.j];
    var v=votesFor();
    var total=sum(v);
    main.querySelectorAll('.vc-count').forEach(function(el){ el.textContent=v[+el.dataset.pos]; });
    var totalEl=$id('cTotal');
    if(totalEl) totalEl.textContent='共 '+total+' 票';
    var txt=$id('consensusText');
    if(txt) txt.textContent=total?describe(medianPos(v),A,B):'等待投票…';
  }

  function simulateVotes(){
    var v=votesFor();
    var center=Math.floor(Math.random()*9);
    var total=20+Math.floor(Math.random()*9);
    var btn=$id('simBtn'); if(btn) btn.disabled=true;
    var added=0;
    var timer=setInterval(function(){
      v[samplePos(center)]++;
      added++;
      updateVoteUI();
      if(added>=total){ clearInterval(timer); if(btn) btn.disabled=false; }
    },85);
  }

  function lockConsensus(){
    var v=votesFor();
    if(sum(v)===0){ showToast('先记录至少一票，或点击“模拟全班投票”'); return; }
    state.consensusJudgments[curKey()]=posToSaaty(medianPos(v)).value;
    if(state.cur<state.pairs.length-1){ state.cur++; render(); }
    else { state.viewActor='consensus'; state.step=3; render(); }
    save();
  }

  function pickForStudent(pos){
    var st=getStudent(state.mode);
    if(!st) return;
    st.judgments[curKey()]=posToSaaty(pos).value;
    if(state.cur<state.pairs.length-1){ state.cur++; render(); }
    else { showToast(st.name+' 的判断已全部录入'); state.viewActor=st.name; state.step=3; render(); }
    save();
  }

  function genCurrentStudent(){
    var st=getStudent(state.mode);
    if(!st) return;
    st.judgments=genNearConsistent(state.criteria.length);
    state.viewActor=st.name; state.step=3;
    save(); render();
  }

  function autoFillConsensus(){
    var n=state.criteria.length;
    var j=genNearConsistent(n);
    state.pairs.forEach(function(p){ var k=p.i+'-'+p.j; if(!(k in state.consensusJudgments)) state.consensusJudgments[k]=j[k]; });
    state.viewActor='consensus'; state.step=3;
    save(); render();
  }

  function viewSeg(prefix, active){
    return '<div class="actor-bar"><span class="flabel">查看对象</span><div class="seg" id="'+prefix+'Seg">'
      +'<button class="seg-btn'+(active==='consensus'?' is-on':'')+'" data-actor="consensus">班级共识</button>'
      + state.students.map(function(s){ return '<button class="seg-btn'+(active===s.name?' is-on':'')+'" data-actor="'+esc(s.name)+'">'+esc(s.name)+'</button>'; }).join('')
      +'</div></div>';
  }

  function attachViewSeg(prefix){
    var seg=$id(prefix+'Seg');
    if(!seg) return;
    seg.querySelectorAll('.seg-btn[data-actor]').forEach(function(b){
      b.addEventListener('click',function(){ state.viewActor=b.dataset.actor; render(); });
    });
  }

  function renderMatrix(){
    ensurePairs();
    var n=state.criteria.length;
    if(n<2){ main.innerHTML='<section class="panel"><div class="panel-head"><h2>请先完成第一步设置</h2></div><div class="controls"><button id="toSetup" class="btn btn-primary">'+ic('left')+' 返回设定</button></div></section>'; $id('toSetup').addEventListener('click',function(){ state.step=1; render(); }); return; }
    if(state.viewActor==='consensus' || !getStudent(state.viewActor)){ state.viewActor='consensus'; }
    var j=actorJudgments(state.viewActor);

    var rows='<tr><th class="corner">指标</th>'+state.criteria.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
    for(var i=0;i<n;i++){
      var cells='<th class="row-head">'+esc(state.criteria[i])+'</th>';
      for(var jj=0;jj<n;jj++){
        var val, cls='';
        if(i===jj){ val='1'; cls='diag'; }
        else if(i<jj){
          var has=((i+'-'+jj) in j);
          val=fmtValue(j[i+'-'+jj]||1);
          if(has) cls='cell-new';
        } else {
          val=fmtValue(1/(j[jj+'-'+i]||1));
        }
        cells+='<td class="'+cls+'">'+val+'</td>';
      }
      rows+='<tr>'+cells+'</tr>';
    }

    main.innerHTML=''
      +'<section class="panel">'
      +'<div class="panel-head"><h2>第三步 · 判断矩阵</h2><p>a<sub>ij</sub> 表示行指标相对列指标的重要程度，a<sub>ji</sub> = 1 / a<sub>ij</sub>。当前查看：'+esc(state.viewActor)+'。</p></div>'
      + viewSeg('m', state.viewActor)
      +'<div class="matrix-wrap"><table class="matrix">'+rows+'</table></div>'
      +'<div class="controls">'
      +'<span class="spacer"></span>'
      +'<button id="backBtn" class="btn btn-ghost">'+ic('left')+' 返回比较</button>'
      +'<button id="resultBtn" class="btn btn-primary">'+ic('right')+' 计算权重与一致性</button>'
      +'</div>'
      +'</section>';
    attachViewSeg('m');
    $id('backBtn').addEventListener('click',function(){ state.cur=0; state.step=2; render(); });
    $id('resultBtn').addEventListener('click',function(){ state.step=4; render(); });
  }
  function renderResults(){
    ensurePairs();
    var n=state.criteria.length;
    if(n<2){ main.innerHTML='<section class="panel"><div class="panel-head"><h2>请先完成第一步设置</h2></div><div class="controls"><button id="toSetup" class="btn btn-primary">'+ic('left')+' 返回设定</button></div></section>'; $id('toSetup').addEventListener('click',function(){ state.step=1; render(); }); return; }
    if(state.viewActor==='consensus' || !getStudent(state.viewActor)){ state.viewActor='consensus'; }
    var r=compute(actorJudgments(state.viewActor), n);

    var order=r.w.map(function(v,i){return {i:i,v:v};}).sort(function(a,b){return b.v-a.v;});
    var maxW=order[0].v;
    var bars=order.map(function(o){
      var pct=(o.v*100).toFixed(1);
      var width=(o.v/maxW*100).toFixed(1);
      return '<div class="bar-row"><span class="bar-label">'+esc(state.criteria[o.i])+'</span><div class="bar-track"><div class="bar-fill" style="width:'+width+'%"></div></div><span class="bar-pct">'+pct+'%</span></div>';
    }).join('');

    var crPct=Math.min(100, r.CR/0.3*100);
    var verdict, vcls;
    if(r.CR<=0.1){ verdict='一致性通过，判断矩阵可用'; vcls='ok'; }
    else if(r.CR<=0.2){ verdict='一致性偏低，建议重新讨论分歧较大的组'; vcls='warn'; }
    else { verdict='一致性较差，需要重新修正判断'; vcls='bad'; }

    main.innerHTML=''
      +'<section class="panel">'
      +'<div class="panel-head"><h2>第四步 · 权重与一致性检验</h2><p>“'+esc(state.problem)+'” 的指标权重，当前查看：'+esc(state.viewActor)+'。</p></div>'
      + viewSeg('r', state.viewActor)
      +'<div class="result-grid">'
      +'<div class="card"><h3>指标权重</h3>'+bars+'</div>'
      +'<div class="card"><h3>一致性检验</h3>'
      +'<div class="metric"><span>λ<sub>max</sub></span><b>'+r.lambda.toFixed(3)+'</b></div>'
      +'<div class="metric"><span>CI</span><b>'+r.CI.toFixed(4)+'</b></div>'
      +'<div class="metric"><span>CR</span><b>'+r.CR.toFixed(4)+'</b></div>'
      +'<div class="gauge-track"><div class="gauge-marker" style="left:'+crPct+'%"></div></div>'
      +'<div class="verdict '+vcls+'">'+verdict+'</div>'
      +'<p class="hint">当 CR ≤ 0.10 时认为判断矩阵具有满意的一致性；CR &gt; 0.10 时建议回到第二步重新讨论。</p>'
      +'</div>'
      +'</div>'
      +'<div class="controls">'
      +'<span class="spacer"></span>'
      +'<button id="back2Btn" class="btn btn-ghost">'+ic('left')+' 返回矩阵</button>'
      +'<button id="compareBtn" class="btn btn-primary">'+ic('chart')+' 查看全体学生对比</button>'
      +'</div>'
      +'</section>';
    attachViewSeg('r');
    $id('back2Btn').addEventListener('click',function(){ state.step=3; render(); });
    $id('compareBtn').addEventListener('click',function(){ state.step=5; render(); });
  }

  function renderCompareStudents(){
    ensurePairs();
    var n=state.criteria.length;
    if(n<2){ main.innerHTML='<section class="panel"><div class="panel-head"><h2>请先完成第一步设置</h2></div><div class="controls"><button id="toSetup" class="btn btn-primary">'+ic('left')+' 返回设定</button></div></section>'; $id('toSetup').addEventListener('click',function(){ state.step=1; render(); }); return; }

    var actors=completeActors();
    if(actors.length<2){
      main.innerHTML=''
        +'<section class="panel">'
        +'<div class="panel-head"><h2>第五步 · 不同学生的主观矩阵对比</h2><p>至少需要 2 名已完成判断的学生（或班级共识）才能对比。</p></div>'
        +'<div class="controls">'
        +'<button id="demoAllBtn" class="btn btn-accent">'+ic('zap')+' 为所有学生随机生成示例矩阵</button>'
        +'<span class="spacer"></span>'
        +'<button id="toCompare" class="btn btn-primary">'+ic('right')+' 去两两比较录入</button>'
        +'</div>'
        +'</section>';
      $id('demoAllBtn').addEventListener('click',function(){ genDemoStudents(); });
      $id('toCompare').addEventListener('click',function(){ state.step=2; render(); });
      return;
    }

    var rows=actors.map(function(a){ return {actor:a, color:actorColor(a), r:compute(actorJudgments(a), n)}; });

    var legend=rows.map(function(row){ return '<span class="lg"><i style="background:'+row.color+'"></i>'+esc(row.actor)+'</span>'; }).join('');

    var bars=state.criteria.map(function(c,ci){
      var inner=rows.map(function(row){
        var w=row.r.w[ci]*100;
        return '<div class="cmp-stu"><span class="stu-name">'+esc(row.actor)+'</span><div class="cmp-track"><div class="cmp-fill" style="width:'+w.toFixed(1)+'%;background:'+row.color+'"></div></div><span class="cmp-val">'+w.toFixed(1)+'%</span></div>';
      }).join('');
      return '<div class="cmp-row"><span class="cmp-label">'+esc(c)+'</span><div class="cmp-bars">'+inner+'</div></div>';
    }).join('');

    var header='<tr><th class="row-head">学生</th>'+state.criteria.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'<th>CR</th><th>结论</th></tr>';
    var tableRows=rows.map(function(row){
      var maxIdx=argmax(row.r.w);
      var cells=state.criteria.map(function(c,ci){
        var pct=(row.r.w[ci]*100).toFixed(1);
        return '<td class="'+(ci===maxIdx?'max':'')+'">'+pct+'%</td>';
      }).join('');
      var ok=row.r.CR<=0.1;
      return '<tr><th class="row-head">'+esc(row.actor)+'</th>'+cells+'<td>'+row.r.CR.toFixed(3)+'</td><td class="'+(ok?'ok-t':'bad-t')+'">'+(ok?'一致':'需修正')+'</td></tr>';
    }).join('');

    main.innerHTML=''
      +'<section class="panel">'
      +'<div class="panel-head"><h2>第五步 · 不同学生的主观矩阵对比</h2><p>同一决策问题下，每位学生基于自己主观判断得到的权重与一致性。</p></div>'
      +'<div class="cmp-legend">'+legend+'</div>'
      + bars
      +'<div class="matrix-wrap"><table class="matrix stu-table">'+header+tableRows+'</table></div>'
      +'<div class="controls">'
      +'<button id="demoAllBtn" class="btn btn-accent">'+ic('zap')+' 重新随机生成所有学生</button>'
      +'<button id="exportBtn" class="btn">'+ic('down')+' 导出 JSON</button>'
      +'<label class="btn" for="importInput">'+ic('up')+' 导入 JSON<input id="importInput" class="sr-file" type="file" accept="application/json,.json"></label>'
      +'<span class="spacer"></span>'
      +'<button id="toMatrixBtn" class="btn btn-ghost">'+ic('left')+' 返回矩阵</button>'
      +'</div>'
      +'</section>';
    $id('demoAllBtn').addEventListener('click',genDemoStudents);
    $id('exportBtn').addEventListener('click',exportData);
    $id('importInput').addEventListener('change',function(e){ importJSON(e.target.files[0]); });
    $id('toMatrixBtn').addEventListener('click',function(){ state.step=3; render(); });
  }

  function genDemoStudents(){
    var n=state.criteria.length;
    if(state.students.length===0){ showToast('请先在第一步添加至少一名学生'); return; }
    state.students.forEach(function(s){ s.judgments=genNearConsistent(n); });
    save(); render();
  }

  function resetAll(){
    state.problem='华为海外研发中心选址';
    state.alternatives=['德国','英国','马来西亚'];
    state.criteria=['人才与研发资源','成本与运营效率','产业与创新生态','政策与营商环境','市场与客户接近度'];
    state.students=[{name:'学生甲',judgments:{}},{name:'学生乙',judgments:{}},{name:'学生丙',judgments:{}}];
    state.consensusJudgments={};
    state.votes={};
    state.pairs=[]; state.cur=0; state.step=1; state.mode='consensus'; state.viewActor='consensus';
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    render();
  }

  document.getElementById('btnReset').addEventListener('click',resetAll);

  if(!load()){ ensurePairs(); }
  render();
})();
</script>
</body>
</html>
